  <h1>Tongue Twister Generator</h1>

  <div id="output" style="margin-top: 20px; font-style: italic;"></div>

  <script>
    function generate() {
      const val = document.getElementById('letterInput').value;
      document.getElementById('output').innerText = "Letter: " + val;
      // Nothing here yet — build me! Could pull from a word bank per letter.
    }
  </script>
</body>
</html>
